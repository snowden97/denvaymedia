  <script>
    // Send the visitor to their language: saved choice first, then the browser language, else English.
    (function () {
      var langs = ["en", "fr", "de", "es", "pt", "it", "nl", "sv", "no", "da", "fi"];
      var saved = (document.cookie.match(/(?:^|; )NEXT_LOCALE=([a-z]+)/) || [])[1];
      var pick = langs.indexOf(saved) > -1 ? saved : null;
      if (!pick) {
        var prefs = navigator.languages || [navigator.language || "en"];
        for (var i = 0; i < prefs.length && !pick; i++) {
          var base = String(prefs[i]).toLowerCase().split("-")[0];
          if (base === "nb" || base === "nn") base = "no";
          if (langs.indexOf(base) > -1) pick = base;
        }
      }
      // relative address: works at the domain root and inside a GitHub sub-folder
      location.replace((pick || "en") + "/" + location.search + location.hash);
    })();
  </script>
